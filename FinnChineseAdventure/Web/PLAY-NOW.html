let cachedVoices=[];
function refreshVoices(){
  try{cachedVoices=window.speechSynthesis?window.speechSynthesis.getVoices():[]}catch(e){cachedVoices=[]}
}
refreshVoices();
try{if(window.speechSynthesis)window.speechSynthesis.onvoiceschanged=refreshVoices}catch(e){}
function bestVoice(langCode){
  refreshVoices();
  let list=cachedVoices||[];
  if(langCode==="en-US"){
    const preferred=["Samantha","Ava","Allison","Nicky","Aaron","Alex","Google US English","Microsoft Aria"];
    for(const name of preferred){
      let v=list.find(x=>x.lang&&x.lang.toLowerCase().startsWith("en-us")&&x.name.includes(name));
      if(v)return v
    }
    return list.find(x=>x.lang&&x.lang.toLowerCase()==="en-us")
      || list.find(x=>x.lang&&x.lang.toLowerCase().startsWith("en-"))
      || null
  }
  if(langCode==="zh-TW"){
    return list.find(x=>x.lang&&x.lang.toLowerCase()==="zh-tw")
      || list.find(x=>x.lang&&x.lang.toLowerCase().startsWith("zh-"))
      || null
  }
  return list.find(x=>x.lang===langCode)||null
}
function voice(t,langCode,rate){
  return new Promise(res=>{
    if(!("speechSynthesis"in window)){res();return}
    let u=new SpeechSynthesisUtterance(String(t||""));
    u.lang=langCode;
    let v=bestVoice(langCode); if(v)u.voice=v;
    u.rate=rate||1;
    u.pitch=1;
    u.volume=1;
    u.onend=res;u.onerror=res;
    speechSynthesis.speak(u)
  })
}
function speak(t){try{if("speechSynthesis"in window)window.speechSynthesis.cancel();voice(t,"zh-TW",speechRates().zh)}catch(e){}}
function naturalEnglish(t){
  t=String(t||"").trim();
  if(!t)return t;
  if(t===t.toUpperCase() && /[A-Z]/.test(t)){
    t=t.toLowerCase().replace(/(^|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase())
  }
  return t
}
async function bilingual(en,zh){
  try{
    if(!("speechSynthesis"in window))return;
    window.speechSynthesis.cancel();
    let r=speechRates();
    if(en)await voice(naturalEnglish(en),"en-US",r.en);
    if(en&&zh)await new Promise(x=>setTimeout(x,r.pause));
    if(zh)await voice(zh,"zh-TW",r.zh)
  }catch(e){}
}
function announce(item){
  if(level===1 && item && item[4]==="bank"){speak(item[0]);return}
  if(difficulty>=4 && item){speak(item[0]);return}
  if(item)bilingual(item[1],item[0])
}

<script>
(function(){
  if (!("serviceWorker" in navigator)) return;
  window.addEventListener("load", async function(){
    try {
      const flag = "finn_sw_migrated_136";
      if (!localStorage.getItem(flag)) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
        localStorage.setItem(flag, "1");
      }
      const reg = await navigator.serviceWorker.register("./service-worker.js?v=136");
      reg.update();
      let reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", function(){
        if (reloading) return;
        reloading = true;
        location.reload();
      });
    } catch(e) { console.warn("SW update skipped", e); }
  });
})();
</script>
<script>
(function(){
